# From https://selan.ai/docs/agents/code-review (GitLab CI). Merge the job into .gitlab-ci.yml; add the workflow block only if
# the file has none, or every other job runs twice per push once MR pipelines exist.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

review:
  stage: test
  image: node:26
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  timeout: 20m
  interruptible: true
  cache:
    when: always
    key: review-$CI_MERGE_REQUEST_IID
    paths: [previous-review.md]
  variables:
    GIT_DEPTH: 0
  script:
    # Not `curl | sh`: piped, a failed `curl -f` leaves sh reading EOF and exiting 0,
    # so the step goes green with nothing installed.
    - curl -fsSL https://dl.selan.ai/install.sh -o /tmp/install-selan.sh
    - sh /tmp/install-selan.sh
    - npm install -g @anthropic-ai/claude-code

    # `selan agent-run` passes --dangerously-skip-permissions, and Claude Code exits 1
    # on that flag at uid 0. Container images run as root, so drop to a user.
    - install -d -o node -g node /tmp/agent
    - chown -R node:node "$CI_PROJECT_DIR"

    # Out of the agent's reach, since a diff can talk it into anything: the runner's directory
    # beside the checkout, whose git config holds CI_JOB_TOKEN (deleted; git skips a missing
    # include) and whose env file every later stage exports as root, and the world-writable volumes
    # above it, where a rename would swap either. after_script puts back the modes recorded here.
    - |
      rm -f "$RUNNER_TEMP_PROJECT_DIR/.gitlab-runner.ext.conf"
      install -m 600 /dev/null /tmp/review-modes
      for d in "$CI_BUILDS_DIR" "$(dirname "$CI_PROJECT_DIR")" /cache; do
        if [ -d "$d" ]; then stat -c '%a %n' "$d" >> /tmp/review-modes; chmod go-w "$d"; fi
      done
      find "$RUNNER_TEMP_PROJECT_DIR" -exec stat -c '%a %n' {} + >> /tmp/review-modes
      chmod -R go-rw "$RUNNER_TEMP_PROJECT_DIR"
    # Fails closed: a runner that writes the token into the checkout itself stops the job here.
    - |
      if grep -rqF -- "$CI_JOB_TOKEN" "$CI_PROJECT_DIR"; then
        echo "CI_JOB_TOKEN is in the checkout, where the agent could read it" >&2; exit 1
      fi

    # The checks and the conversion run as `node` too: root following a link the agent left in
    # the checkout could overwrite any file. The agent gets named variables, never the job's
    # environment: CI_JOB_TOKEN and every other secret stay out. SELAN_TOKEN stays because Claude
    # Code authenticates with it; the CI three are what the prompt and the agent file read.
    - |
      cat > /tmp/review.sh <<'SH'
      set -e
      export HOME=/tmp/agent
      export CLAUDE_CONFIG_DIR=/tmp/agent/.claude
      selan agent-run code-review \
        "Review this merge request. \`git diff $CI_MERGE_REQUEST_DIFF_BASE_SHA HEAD\` is the change.
         Write your review to $CI_PROJECT_DIR/review.md. Your previous review,
         if there is one, is at $CI_PROJECT_DIR/previous-review.md."
      [ -s review.md ] || { echo "the agent wrote no review" >&2; exit 1; }
      cp review.md previous-review.md
      node scripts/review-to-codequality.mjs review.md gl-code-quality-report.json
      SH
      env -i PATH="$PATH" SELAN_TOKEN="$SELAN_TOKEN" CI_PROJECT_DIR="$CI_PROJECT_DIR" \
        CI_MERGE_REQUEST_DIFF_BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
        CI_MERGE_REQUEST_TITLE="$CI_MERGE_REQUEST_TITLE" \
        su -p node -c "sh /tmp/review.sh"
  artifacts:
    when: always
    paths: [review.md, gl-code-quality-report.json]
    reports:
      codequality: gl-code-quality-report.json
  # The script's container, restarted: /tmp still holds the modes, and the stop between stages
  # ended every process of the agent's.
  after_script:
    - while read -r mode path; do chmod "$mode" "$path"; done < /tmp/review-modes
    # Config, hooks or a commondir the agent wrote into .git never reach the next job's checkout.
    - rm -rf "$CI_PROJECT_DIR/.git"
